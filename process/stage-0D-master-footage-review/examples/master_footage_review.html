<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 0D｜全素材審片</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{margin:0;background:#111827;color:#f3f4f6;padding-bottom:60px}
#phead{display:flex;gap:6px;align-items:center;cursor:move;user-select:none;margin-bottom:6px;font-size:12px;color:#9ca3af}#phead span{flex:1}
#player.min video,#player.min #ptitle{display:none}
header{position:sticky;top:0;z-index:10;padding:12px 20px;background:rgba(17,24,39,.97);border-bottom:1px solid #374151}
h1{margin:0 0 8px;font-size:20px}h2{margin:0 0 4px;font-size:17px}h3{margin:12px 0 4px;font-size:14px;color:#93c5fd}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,textarea,input,button{box-sizing:border-box;border:1px solid #4b5563;border-radius:8px;background:#1f2937;color:#f9fafb;padding:7px 9px;font:inherit}
button{cursor:pointer}button:hover{background:#374151}
main{max-width:1400px;margin:0 auto;padding:16px 20px}
.card{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px;margin-bottom:16px;padding:14px;background:#1f2937;border:1px solid #374151;border-radius:14px}
.card.playing{border-color:#60a5fa}
.hero{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b1020;border-radius:10px;cursor:pointer}
.strip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.strip figure{margin:0;flex:none;text-align:center;font-size:11px;color:#9ca3af}
.strip img{width:116px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer;display:block}
.meta,.hint,.save-state{color:#9ca3af;font-size:13px}
.summary{white-space:pre-wrap;line-height:1.55;font-size:14px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.badge{padding:3px 9px;border-radius:999px;background:#374151;font-size:12px}
.b-hi{background:#065f46}.b-skip{background:#7f1d1d}.b-diff{background:#92400e}
.warn{color:#fbbf24;font-size:13px;margin:2px 0}.quote{font-size:13px;color:#d1d5db;margin:2px 0}
.ev,.hs{font-size:13px;margin:3px 0;padding:6px 8px;background:#111827;border-radius:6px}
.seg{display:grid;grid-template-columns:116px 1fr;gap:8px;align-items:start;margin:6px 0;padding:6px;background:#111827;border-radius:8px}
.seg img{width:116px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer}
.seg-ctl{display:grid;grid-template-columns:150px 1fr;gap:6px}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #374151}
.field{display:grid;gap:5px}.field.full{grid-column:1/-1}
textarea{width:100%;min-height:64px;resize:vertical}
.empty{padding:36px;text-align:center;color:#9ca3af}
#player{position:fixed;left:14px;bottom:14px;z-index:20;width:380px;max-width:calc(100vw - 28px);background:#0b1020;border:1px solid #4b5563;border-radius:12px;padding:8px;box-shadow:0 8px 30px #000a}
#player video{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px}
#ptitle{font-size:12px;color:#d1d5db;margin:4px 0;word-break:break-all}
.pbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
dialog{background:#1f2937;color:#f3f4f6;border:1px solid #4b5563;border-radius:12px;max-width:520px;width:92vw}dialog::backdrop{background:#000a}
@media(max-width:850px){.card,.review-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Stage 0D｜全素材審片（AI × 人工）</h1>
  <div class="toolbar">
    <label for="filter">篩選：</label>
    <select id="filter"></select>
    <button id="quick" title="AI 建議略過、但你還沒審查的素材">檢查 AI 建議略過的素材</button>
    <label for="sort">排序：</label>
    <select id="sort"><option value="time">拍攝時間</option><option value="dur">片長（長到短）</option><option value="score">AI 評分（高到低）</option></select>
    <span id="count" class="meta"></span>
  </div>
</header>
<main id="clips"><div class="empty">正在載入審片資料……</div></main>

<div id="player">
  <div id="phead"><span>播放器（可拖曳移動）</span><button id="pside" title="移到另一側">⇄ 換邊</button><button id="pmin">－ 縮小</button></div>
  <video id="video" controls preload="metadata" playsinline></video>
  <div id="ptitle">尚未選擇影片：點擊代表影格或縮圖即可從該時間點播放。</div>
  <div class="pbar"><button id="prev">上一支</button><button id="next">下一支</button><span id="ptime" class="meta"></span></div>
</div>

<dialog id="casedlg"><form method="dialog" id="caseform">
  <h3>回報辨識問題（漏掉動作、辨識錯誤、重要聲音）</h3>
  <p class="hint">只會存成回歸案例，不會改寫 Stage 0 的事實。</p>
  <div class="field"><span id="caseclip" class="meta"></span>
    <label>起始秒數 <input id="cstart" type="number" step="0.1" style="width:90px"></label>
    <label>結束秒數 <input id="cend" type="number" step="0.1" style="width:90px"></label>
    <label>問題描述<textarea id="cissue" required></textarea></label>
    <label>期望檢查結果<textarea id="cexp"></textarea></label>
  </div>
  <div class="pbar" style="margin-top:10px"><button value="ok" id="casesave">儲存案例</button><button value="cancel" formnovalidate>取消</button></div>
</form></dialog>

<script>
const LABELS={
 recommendation:{STRONG_CANDIDATE:'強烈推薦',CANDIDATE:'建議考慮',OPTIONAL:'可選素材',LIKELY_SKIP:'可能略過',TECHNICAL_REJECT:'技術不合格'},
 priority:{HIGH:'高',MEDIUM:'中',LOW:'低'},
 status:{NOT_REVIEWED:'尚未審查',NO_PREFERENCE:'不指定是否選用',CANDIDATE:'列為候選',IMPORTANT:'重要素材',MUST_REVIEW:'必須再看',MUST_KEEP:'必須保留',SKIP:'略過'},
 action:{NONE:'不修改',APPEND:'補充內容',CORRECT:'修正錯誤',REPLACE:'改寫摘要'},
 relation:{AGREE_KEEP:'AI 與人工都想留',AGREE_SKIP:'AI 與人工都略過',AI_KEEP_HUMAN_SKIP:'AI 推薦但人工略過',AI_SKIP_HUMAN_KEEP:'AI 建議略過但人工想留',HUMAN_NO_PREFERENCE:'人工不指定',HUMAN_NOT_REVIEWED:'人工尚未審查'}
};
const FILTERS=[['ALL','全部素材'],['NOT_REVIEWED','人工：尚未審查'],['STRONG_CANDIDATE','AI：強烈推薦'],['CANDIDATE_AI','AI：建議考慮'],['LIKELY_SKIP','AI：可能略過'],
 ['NO_PREFERENCE','人工：不指定是否選用'],['CANDIDATE','人工：列為候選'],['IMPORTANT','人工：重要素材'],['MUST_REVIEW','人工：必須再看'],['MUST_KEEP','人工：必須保留'],['SKIP','人工：略過'],
 ['DIFF','AI／人工意見不同'],['LONG','長影片（60 秒以上）'],['PEOPLE','有人物'],['ANIMAL','有動物'],['REACTION','有反應（Reaction）'],['QUICK','檢查 AI 建議略過的素材']];
let all=[],view=[],cur=-1;const timers=new Map();
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(m,sel)=>Object.entries(m).map(([v,l])=>`<option value="${v}"${v===sel?' selected':''}>${l}</option>`).join('');
const lt=a=>Array.isArray(a)&&a.length?a.join('、'):'無';
const ft=s=>{s=+s;return s>=60?`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`:`${s.toFixed(1)} 秒`};
$('#filter').innerHTML=FILTERS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');

function matches(c,f){
 const st=c.human_review?.status||'NOT_REVIEWED',rec=c.ai_review.recommendation,rel=c.review_relationship;
 switch(f){case'ALL':return true;case'STRONG_CANDIDATE':return rec==='STRONG_CANDIDATE';case'CANDIDATE_AI':return rec==='CANDIDATE';
 case'LIKELY_SKIP':return rec==='LIKELY_SKIP'||rec==='TECHNICAL_REJECT';case'DIFF':return rel==='AI_KEEP_HUMAN_SKIP'||rel==='AI_SKIP_HUMAN_KEEP'||Object.values(c.segment_relationships||{}).some(r=>r==='AI_KEEP_HUMAN_SKIP'||r==='AI_SKIP_HUMAN_KEEP');
 case'LONG':return c.duration>=60;case'PEOPLE':return c.visible_people.length>0;case'ANIMAL':return c.visible_animals.length>0;case'REACTION':return c.has_reaction;
 case'QUICK':return(rec==='LIKELY_SKIP'||rec==='TECHNICAL_REJECT'||c.ai_review.priority==='LOW')&&st==='NOT_REVIEWED';
 default:return st===f;}
}
const img=(f,t,id)=>`<img src="frames/${encodeURIComponent(f)}" data-play="${esc(id)}" data-ts="${t}" alt="${ft(t)} 影格" loading="lazy">`;
function card(c){
 const h=c.human_review||{},fb=h.summary_feedback||{},rec=c.ai_review.recommendation,pri=c.ai_review.priority,rel=c.review_relationship;
 const cls=rec==='STRONG_CANDIDATE'?'b-hi':(rec==='LIKELY_SKIP'||rec==='TECHNICAL_REJECT')?'b-skip':'';
 const strip=[{img:c.hero_frame,ts:c.hero_time,l:'代表'}].concat(c.contact_strip.map(f=>({img:f.img,ts:f.ts,l:ft(f.ts)})))
   .map(f=>`<figure>${img(f.img,f.ts,c.clip_id)}${esc(f.l)}</figure>`).join('');
 const segs=c.segments.length?`<h3>段落（${c.segments.length} 段，可分段標記）</h3>`+c.segments.map(s=>{const r=(h.segment_reviews||{})[s.segment_id]||{};
   return `<div class="seg" data-seg="${esc(s.segment_id)}"><figure style="margin:0">${img(s.img,s.ts,c.clip_id)}</figure><div><div class="meta">${ft(s.start)}–${ft(s.end)}｜${esc(s.activity_zh)}</div>
   <div class="seg-ctl"><select class="seg-status">${opts(LABELS.status,r.status||'NOT_REVIEWED')}</select><input class="seg-reason" placeholder="此段選片理由（選填）" value="${esc(r.reason||'')}"></div></div></div>`}).join(''):'';
 const evs=c.events.length?c.events.map(e=>`<div class="ev"><b>${esc(e.event_id)}</b>｜${esc(e.event_type_zh)}｜${esc(e.location)}｜本片 ${ft(e.start)}–${ft(e.end)}<br>${esc(e.summary)}</div>`).join(''):'<div class="ev">未歸入任何事件</div>';
 const hs=c.hero_scenes.length?c.hero_scenes.map(x=>`<div class="hs">精彩場景候選${x.candidate_id?' '+esc(x.candidate_id):''}｜${ft(x.start)}–${ft(x.end)}｜${esc(x.status_zh)}<br>${esc(x.reason_zh)}</div>`).join(''):'';
 const fbHtml=(fb.action&&fb.action!=='NONE'&&fb.text)?`<p class="summary"><b>人工${esc(LABELS.action[fb.action])}（人工輸入）：</b>${esc(fb.text)}</p>`:'';
 return `<article class="card" data-id="${esc(c.clip_id)}">
 <section><img class="hero" src="frames/${encodeURIComponent(c.hero_frame)}" data-play="${esc(c.clip_id)}" data-ts="${c.hero_time}" alt="代表影格" loading="lazy"><div class="strip">${strip}</div>${segs}</section>
 <section><h2>${esc(c.filename)}</h2>
 <div class="meta">拍攝：${esc(c.local_time.replace('T',' '))}（UTC${esc(c.tz_offset)}）｜長度 ${ft(c.duration)}｜${esc(c.resolution)}｜${esc(c.fps)} fps｜${esc(c.color_profile)}</div>
 <div class="badges"><span class="badge ${cls}">AI：${LABELS.recommendation[rec]}</span><span class="badge">優先級：${LABELS.priority[pri]}</span><span class="badge">人工：${LABELS.status[h.status||'NOT_REVIEWED']}</span>
 <span class="badge ${rel.includes('AI_')?'b-diff':''}">${LABELS.relation[rel]}</span></div>
 <h3>AI 畫面摘要</h3><div class="summary">${esc(c.visual_summary||'沒有摘要')}</div>${fbHtml}
 <div class="meta">人物：${esc(lt(c.visible_people))}｜動物：${esc(lt(c.visible_animals))}｜物件：${esc(lt(c.visual_objects))}｜動作：${esc(lt(c.visual_actions))}</div>${(c.signage_text_original||[]).length?`<div class="meta">畫面文字／招牌（原文，視覺模型辨識，未驗證）：${esc(c.signage_text_original.join('、'))}</div>`:''}
 <h3>聲音／逐字稿</h3><div class="meta">${esc(c.audio_summary)}</div>${c.transcript_quotes.map(q=>`<div class="quote">「${esc(q)}」</div>`).join('')}
 ${c.uncertainty_cues.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}
 <h3>關聯事件</h3>${evs}${hs?'<h3>精彩場景候選</h3>'+hs:''}
 <h3>AI 評估</h3><p class="summary">${esc(c.ai_review.reason)}</p>
 <div class="review-grid">
  <label class="field"><span>摘要回饋</span><select class="summary-action">${opts(LABELS.action,fb.action||'NONE')}</select></label>
  <label class="field"><span>選片意願</span><select class="review-status">${opts(LABELS.status,h.status||'NOT_REVIEWED')}</select></label>
  <label class="field full"><span>補充或修正內容</span><textarea class="summary-text" placeholder="只補充內容不代表要選用；未指定選片意願時會保存為「不指定是否選用」。">${esc(fb.text||'')}</textarea></label>
  <label class="field full"><span>選片理由（只有選片意願需要時才填）</span><textarea class="review-reason" placeholder="例如：這是唯一拍到完整反應的素材。">${esc(h.reason||'')}</textarea></label>
  <div class="field full"><span class="hint">摘要回饋與選片意願分開保存；補充摘要不會自動變成候選或必須保留。</span>
  <div class="pbar"><span class="save-state">尚未修改</span><button class="report">回報辨識問題</button></div></div>
 </div></section></article>`;
}
function bind(el){
 el.querySelectorAll('select,textarea,input').forEach(x=>{x.addEventListener('input',()=>sched(el));});
 el.querySelector('.report').addEventListener('click',()=>openCase(el.dataset.id));
}
function sched(el){const id=el.dataset.id;el.querySelector('.save-state').textContent='等待儲存……';clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>save(el),600));}
async function save(el){
 const id=el.dataset.id,c=all.find(x=>x.clip_id===id);
 const action=el.querySelector('.summary-action').value,text=el.querySelector('.summary-text').value.trim();
 let status=el.querySelector('.review-status').value;
 if((action!=='NONE'||text)&&status==='NOT_REVIEWED'){status='NO_PREFERENCE';el.querySelector('.review-status').value=status;}
 const segs={};el.querySelectorAll('.seg').forEach(s=>{segs[s.dataset.seg]={status:s.querySelector('.seg-status').value,reason:s.querySelector('.seg-reason').value,updated_at:new Date().toISOString()};});
 const st=el.querySelector('.save-state');st.textContent='儲存中……';
 try{
  const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clip_id:id,status,reason:el.querySelector('.review-reason').value,segment_reviews:segs,
   summary_feedback:{action,text,target_fields:['visual_summary'],affects_selection:false,updated_at:new Date().toISOString()}})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  c.human_review={status,reason:el.querySelector('.review-reason').value,segment_reviews:segs,summary_feedback:{action,text}};
  st.textContent='已儲存';
 }catch(e){st.textContent='儲存失敗：'+e.message;}
}
function render(){
 const f=$('#filter').value,s=$('#sort').value;
 view=all.filter(c=>matches(c,f));
 view.sort(s==='dur'?(a,b)=>b.duration-a.duration:s==='score'?(a,b)=>b.ai_review.score-a.ai_review.score:(a,b)=>a.creation_time_utc.localeCompare(b.creation_time_utc));
 $('#count').textContent=`顯示 ${view.length}／${all.length} 支影片`;
 const root=$('#clips');root.innerHTML=view.length?view.map(card).join(''):'<div class="empty">沒有符合條件的素材。</div>';
 root.querySelectorAll('.card').forEach(bind);
}
function play(id,ts){
 const c=all.find(x=>x.clip_id===id);if(!c)return;const v=$('#video');
 const go=()=>{v.currentTime=ts;v.play().catch(()=>{});};
 cur=view.findIndex(x=>x.clip_id===id);
 if(!v.src.endsWith(c.play_url)){v.src=c.play_url;v.addEventListener('loadedmetadata',go,{once:true});}else go();
 $('#ptitle').textContent=`${c.filename}｜從 ${ft(ts)} 開始（審片用 H.264 代理檔，時間與原片 1:1）`;
 document.querySelectorAll('.card.playing').forEach(x=>x.classList.remove('playing'));
 const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);if(el)el.classList.add('playing');
}
function step(d){if(!view.length)return;const i=Math.min(Math.max((cur<0?0:cur)+d,0),view.length-1);const c=view[i];
 document.querySelector(`.card[data-id="${CSS.escape(c.clip_id)}"]`)?.scrollIntoView({block:'start',behavior:'smooth'});play(c.clip_id,c.hero_time);}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#video').addEventListener('timeupdate',()=>{$('#ptime').textContent=ft($('#video').currentTime)+' / '+ft($('#video').duration||0);});
document.addEventListener('click',e=>{const t=e.target.closest('[data-play]');if(t)play(t.dataset.play,+t.dataset.ts);});
$('#filter').onchange=render;$('#sort').onchange=render;$('#quick').onclick=()=>{$('#filter').value='QUICK';render();};
(function(){const P=$('#player');
 try{const pos=JSON.parse(localStorage.getItem('s0d_player')||'null');if(pos){P.style.left=pos.left;P.style.top=pos.top;P.style.bottom='auto';P.style.right='auto';}}catch(e){}
 $('#pmin').onclick=()=>{P.classList.toggle('min');$('#pmin').textContent=P.classList.contains('min')?'＋ 展開':'－ 縮小';};
 $('#pside').onclick=()=>{const left=P.style.right==='auto'||P.style.right===''&&P.style.left!=='auto'?true:false;const onLeft=P.getBoundingClientRect().left<innerWidth/2;
  P.style.top='auto';P.style.bottom='14px';if(onLeft){P.style.left='auto';P.style.right='14px';}else{P.style.right='auto';P.style.left='14px';}try{localStorage.removeItem('s0d_player')}catch(e){}};
 let d=null;$('#phead').addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;const r=P.getBoundingClientRect();d={x:e.clientX-r.left,y:e.clientY-r.top};$('#phead').setPointerCapture(e.pointerId);});
 $('#phead').addEventListener('pointermove',e=>{if(!d)return;P.style.left=Math.max(0,Math.min(innerWidth-100,e.clientX-d.x))+'px';P.style.top=Math.max(0,Math.min(innerHeight-60,e.clientY-d.y))+'px';P.style.bottom='auto';P.style.right='auto';});
 $('#phead').addEventListener('pointerup',()=>{if(d){d=null;try{localStorage.setItem('s0d_player',JSON.stringify({left:P.style.left,top:P.style.top}))}catch(e){}}});
})();
let caseId=null;
function openCase(id){caseId=id;const v=$('#video');$('#caseclip').textContent='影片：'+all.find(x=>x.clip_id===id).filename;
 $('#cstart').value=(!v.paused||v.currentTime)&&v.src.includes(id)?v.currentTime.toFixed(1):'';$('#cend').value='';$('#cissue').value='';$('#cexp').value='';$('#casedlg').showModal();}
$('#caseform').addEventListener('submit',async e=>{const ok=e.submitter&&e.submitter.value==='ok';if(!ok)return;
 await fetch('/api/case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clip_id:caseId,start:parseFloat($('#cstart').value)||null,end:parseFloat($('#cend').value)||null,issue:$('#cissue').value,expected:$('#cexp').value})});});
fetch('/api/data').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{all=d;render();})
 .catch(e=>{$('#clips').innerHTML=`<div class="empty">載入失敗：${esc(e.message)}</div>`;});
</script>
</body>
</html>
