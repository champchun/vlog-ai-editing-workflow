<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 0D｜快速滑片</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.top{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(#000c,#0000);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5;font-size:14px}
.top a,.top label{color:#9ca3af;text-decoration:none}
.bot{position:fixed;left:0;right:0;bottom:0;padding:70px 18px 16px;background:linear-gradient(#0000,#000d);z-index:5}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}.badge{padding:3px 10px;border-radius:999px;background:#374151;font-size:13px}
.hi{background:#065f46}.lo{background:#7f1d1d}.mid{background:#1e3a8a}
h2{margin:0 0 4px;font-size:17px}.meta{font-size:13px;color:#cbd5e1;max-width:900px;line-height:1.5}
.reason{display:none;margin-top:6px;max-width:900px;font-size:13px;color:#e5e7eb;line-height:1.55}
.bot.open .reason{display:block}
.marks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:1px solid #4b5563;border-radius:10px;background:#1f2937cc;color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
button:hover{background:#374151}button.on{background:#16a34a;border-color:#4ade80}button.no{background:#b91c1c;border-color:#f87171}button.big{font-size:18px;padding:12px 28px}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:6;width:52px;height:80px;font-size:28px;padding:0;opacity:.6}
#L{left:8px}#R{right:8px}
#prog{position:fixed;top:0;left:0;height:3px;background:#3b82f6;z-index:9}
#hint{position:fixed;right:16px;bottom:16px;z-index:6;font-size:12px;color:#9ca3af;text-align:right;pointer-events:none}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#111827ee;padding:8px 16px;border-radius:8px;z-index:9;display:none}
</style>
</head>
<body>
<div id="prog"></div>
<div class="top"><b>快速滑片</b><span id="pos"></span>
 <label><input type="checkbox" id="segMode" checked> 分段審片</label>
 <label><input type="checkbox" id="onlyNew"> 只看尚未審查</label>
 <label><input type="checkbox" id="onlySkip"> 只看被標「不要」（找 B-roll）</label><label><input type="checkbox" id="onlyBroll"> 只看已標 B-roll</label><a href="/">→ 完整審片頁（回到清單）</a></div>
<div id="stage"><video id="v" playsinline autoplay></video></div>
<button class="nav" id="L" title="上一支（←）">‹</button><button class="nav" id="R" title="下一支（→）">›</button>
<div class="bot" id="bot">
 <div class="badges" id="badges"></div><h2 id="name"></h2><div class="meta" id="meta"></div>
 <div class="reason" id="reason"></div>
 <div class="marks" id="marks"></div>
</div>
<div id="hint">← A-roll（要）｜→ B-roll｜↓ 不要｜↑ 上一支｜A／B 同左右｜空白鍵 暫停｜H 回 Hero／段落起點｜S 從頭播｜I 展開理由｜0 清除｜觸控：左滑 A-roll、右滑 B-roll、下滑不要、上滑回上一支（標記後自動下一支）</div>
<div id="toast"></div>
<script>
const REC={STRONG_CANDIDATE:'強烈推薦',CANDIDATE:'建議考慮',OPTIONAL:'可選素材',LIKELY_SKIP:'可能略過',TECHNICAL_REJECT:'技術不合格'};
const PRI={HIGH:'高',MEDIUM:'中',LOW:'低'};
const RANK={STRONG_CANDIDATE:4,CANDIDATE:3,OPTIONAL:2,LIKELY_SKIP:1,TECHNICAL_REJECT:0};
const ST={NOT_REVIEWED:'尚未審查',NO_PREFERENCE:'不指定是否選用',CANDIDATE:'A-roll（候選）',IMPORTANT:'重要素材',MUST_REVIEW:'必須再看',MUST_KEEP:'必須保留',SKIP:'略過'};
const YES='CANDIDATE',NO='SKIP',KEEPSET=['CANDIDATE','IMPORTANT','MUST_REVIEW','MUST_KEEP'];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ft=s=>{s=+s;return s>=60?`${Math.floor(s/60)}分${Math.round(s%60)}秒`:`${s.toFixed(1)} 秒`};
let all=[],list=[],i=0,cur=null;   // list items: {id, clip, seg|null, start, end}
function itemState(it){const h=it.clip.human_review||{};if(it.seg){const s=(h.segment_reviews||{})[it.seg.segment_id];return {status:s?.status||'NOT_REVIEWED',broll:!!s?.broll}}return {status:h.status||'NOT_REVIEWED',broll:!!h.broll}}
function build(keep){
  const only=$('#onlyNew').checked,sk=$('#onlySkip').checked,br=$('#onlyBroll').checked,seg=$('#segMode').checked;
  const sorted=[...all].sort((a,b)=>(RANK[b.ai_review.recommendation]-RANK[a.ai_review.recommendation])||a.creation_time_utc.localeCompare(b.creation_time_utc));
  let items=[];
  sorted.forEach(c=>{
    if(seg&&c.segments&&c.segments.length)c.segments.forEach(s=>items.push({id:s.segment_id,clip:c,seg:s,start:s.start,end:s.end}));
    else items.push({id:c.clip_id,clip:c,seg:null,start:Math.min(c.hero_time,Math.max(c.duration-0.5,0)),end:c.duration});   // start at the Hero frame time
  });
  list=items.filter(it=>{const s=itemState(it);return (!only||s.status==='NOT_REVIEWED')&&(!sk||s.status===NO)&&(!br||s.broll)});
  i=keep?Math.max(0,list.findIndex(it=>it.id===keep)):0;
  show();
}
function show(){
  if(!list.length){$('#name').textContent='沒有符合的素材';$('#v').removeAttribute('src');cur=null;return;}
  i=Math.min(Math.max(i,0),list.length-1);const it=list[i],c=it.clip,st=itemState(it),rec=c.ai_review.recommendation,v=$('#v');cur=it;
  const same=v.dataset.clip===c.clip_id;const go=()=>{v.currentTime=it.start;v.play().catch(()=>{})};
  if(same&&v.readyState>=1)go();else{v.dataset.clip=c.clip_id;v.src=c.play_url;v.addEventListener('loadedmetadata',go,{once:true});v.load()}
  const nSeg=it.seg?`｜第 ${it.seg.index}／${c.segments.length} 段「${esc(it.seg.label)}」（${it.start.toFixed(1)}–${it.end.toFixed(1)} 秒，循環播放）`:`｜從 Hero 影格 ${it.start.toFixed(1)} 秒開始`;
  $('#pos').textContent=`${i+1} / ${list.length}（依 AI 推薦由高到低）`;
  $('#prog').style.width=(100*(i+1)/list.length)+'%';
  $('#badges').innerHTML=`<span class="badge ${rec==='STRONG_CANDIDATE'?'hi':rec==='CANDIDATE'?'mid':(rec==='LIKELY_SKIP'||rec==='TECHNICAL_REJECT')?'lo':''}">AI：${REC[rec]}</span>
   <span class="badge">優先級 ${PRI[c.ai_review.priority]}</span><span class="badge">${it.seg?'本段':'整支'}人工：${ST[st.status]}</span>${st.broll?'<span class="badge" style="background:#b45309">B-roll</span>':''}${it.seg?`<span class="badge">整支狀態：${ST[c.human_review?.status||'NOT_REVIEWED']}</span>`:''}`;
  $('#name').textContent=c.filename+(it.seg?` · 段 ${it.seg.index}`:'');
  const ev=c.events[0];
  $('#meta').innerHTML=`${esc((c.capture_time_local_at_gps_location||c.creation_time_utc).replace('T',' ').slice(0,19))}｜${ft(c.duration)}${nSeg}${ev?`｜${esc(ev.event_id)} ${esc(ev.title)}`:'｜未形成事件'}｜${esc(c.visible_people.join('、')||'無人物')}<br>${esc((c.visual_summary||'').slice(0,150))}`;
  $('#reason').textContent=c.ai_review.reason;
  $('#marks').innerHTML=`<button data-s="${YES}" data-b="0" class="big ${KEEPSET.includes(st.status)&&!st.broll?'on':''}">← A-roll（要）</button><button data-s="NO_PREFERENCE" data-b="1" class="big ${st.broll?'on':''}">→ B-roll</button><button data-s="${NO}" data-b="0" class="big ${st.status===NO?'no':''}">↓ 不要</button><button data-s="NOT_REVIEWED" data-b="0">0 清除</button><button data-prev="1">↑ 上一支</button>`;
  history.replaceState(null,'','#'+it.id);
}
function go(d){i+=d;show();}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',1200);}
async function mark(s,b){
  const it=list[i];if(!it)return;const c=it.clip,h=c.human_review||{};
  const body=it.seg?{clip_id:c.clip_id,segment_reviews:{[it.seg.segment_id]:{status:s,broll:!!b}}}
                   :{clip_id:c.clip_id,status:s,broll:!!b};
  try{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;
    const d=await (await fetch('/api/data')).json();const nc=d.find(x=>x.clip_id===c.clip_id);const k=all.findIndex(x=>x.clip_id===c.clip_id);all[k]=nc;list.forEach(x=>{if(x.clip.clip_id===c.clip_id)x.clip=nc});
    toast(b?'B-roll ✓':s===YES?'A-roll ✓':s===NO?'不要 ✗':'已清除');if(s!=='NOT_REVIEWED'&&i<list.length-1)i++;show();
  }catch(e){toast('儲存失敗');}
}
$('#marks').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.prev)go(-1);else mark(b.dataset.s,b.dataset.b==='1');});
$('#L').onclick=()=>go(-1);$('#R').onclick=()=>go(1);$('#onlyNew').onchange=$('#onlySkip').onchange=$('#onlyBroll').onchange=$('#segMode').onchange=()=>build(cur?cur.id:null);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){mark('NO_PREFERENCE',true);e.preventDefault();}
  else if(e.key==='ArrowLeft'){mark(YES,false);e.preventDefault();}
  else if(e.key==='ArrowUp'){go(-1);e.preventDefault();}
  else if(e.key==='ArrowDown'){mark(NO,false);e.preventDefault();}
  else if(e.key===' '){const v=$('#v');v.paused?v.play():v.pause();e.preventDefault();}
  else if(e.key==='i'||e.key==='I')$('#bot').classList.toggle('open');
  else if(e.key==='0')mark('NOT_REVIEWED',false);
  else if(e.key==='a'||e.key==='A')mark(YES,false);
  else if(e.key==='b'||e.key==='B')mark('NO_PREFERENCE',true);
  else if(e.key==='h'||e.key==='H'){$('#v').currentTime=cur.start;$('#v').play().catch(()=>{})}
  else if(e.key==='s'||e.key==='S'){$('#v').currentTime=0;$('#v').play().catch(()=>{})}
  });
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){if(dx<0)mark(YES,false);else mark('NO_PREFERENCE',true);}else if(Math.abs(dy)>60){if(dy>0)mark(NO,false);else go(-1);}});
document.addEventListener('wheel',(()=>{let lock=0;return e=>{if(Date.now()<lock||Math.abs(e.deltaY)+Math.abs(e.deltaX)<40)return;lock=Date.now()+500;go((e.deltaY+e.deltaX)>0?1:-1);};})(),{passive:true});
const vEl=$('#v');
vEl.addEventListener('click',()=>{vEl.paused?vEl.play():vEl.pause();});
vEl.addEventListener('timeupdate',()=>{if(cur&&vEl.currentTime>=cur.end-0.05){vEl.currentTime=cur.start;vEl.play().catch(()=>{})}});   // loop inside the segment / from Hero to the end
vEl.addEventListener('ended',()=>{if(cur){vEl.currentTime=cur.start;vEl.play().catch(()=>{})}});
fetch('/api/data').then(r=>r.json()).then(d=>{all=d;build(location.hash.slice(1)||null);});
</script>
</body>
</html>
